name: Native vendor packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-amd64
          - os: macos-15-intel
            target: darwin-amd64
          - os: macos-15
            target: darwin-arm64
          - os: windows-2022
            target: windows-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxcursor-dev libxext-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: python3 -m pip install cmake ninja
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-python
      - name: Select Windows native toolchain
        if: runner.os == 'Windows'
        run: echo 'C:\msys64\ucrt64\bin' >> "$GITHUB_PATH"
      - name: Configure checkout paths
        run: |
          python3 -c 'from pathlib import Path; Path("config/env").write_text("T_STD_PATH=" + str(Path("base/std").resolve()) + "\n")'
      - name: Build pinned SDL3
        run: python3 scripts/setup-sdl.py
      - name: Native import and headless SDL checks
        env:
          TELIA_TEST_SDL: '1'
        run: go test ./internal/ctarget ./internal/native ./tests/integration -run 'TestWchar|TestScalars|TestInvalidNative|TestMissing|TestVendor|TestSDL3|TestBoolean|TestCString' -count=1 -timeout=30m
      - name: SDL facade generation policy checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Unicode and string standard library checks
        run: go test ./tests/integration -run 'TestUTF8|TestString|TestExamplesUsePublishedStandardLibraryAPIs' -count=1 -timeout=10m
      - name: Terminal standard library checks
        run: go test ./tests/integration -run '^TestTerminal' -count=1 -timeout=10m
      - name: Foreign ABI regression fixtures
        run: go test ./internal/sema ./tests/integration -run 'Test(HeaderOwned|Foreign|NamedExtern|Const|Callback|Callbacks|LibcScalar|CScalar|CVariadic|GenericCallback|BorrowedVaList|NativeCallback|LegacyRawPointerVa|ImportedBareFunction|Va|GenericVa|DereferencingVaArg)' -count=1
      - name: Full suite on Linux
        if: runner.os == 'Linux'
        run: go test ./...
      - name: Archive native artifacts without losing symlinks
        run: tar -czf sdl-${{ matrix.target }}.tar.gz -C base/vendor/sdl artifacts/${{ matrix.target }} LICENSE-SDL.txt
      - name: Package ready-to-use Telia release
        run: |
          version=dev
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; fi
          python3 scripts/package-release.py --output telia-${{ matrix.target }}.tar.gz --version "$version" --commit "$GITHUB_SHA"
          python3 scripts/smoke-release.py telia-${{ matrix.target }}.tar.gz --version "$version"
      - name: Windows installer checks (offline)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1 -Archive telia-windows-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sdl-3.2.28-${{ matrix.target }}
          path: sdl-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: telia-${{ matrix.target }}
          path: telia-${{ matrix.target }}.tar.gz

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: sdl
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: telia-*
          merge-multiple: true
          path: release
      - name: Include installers and checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 release/
          cd release
          sha256sum telia-*.tar.gz install.sh install.ps1 > SHA256SUMS
      - name: Publish tested bundles together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft"; then
            test "$(cat "$RUNNER_TEMP/release-draft")" = true || { echo 'Release is already published; refusing to overwrite it.'; exit 1; }
          else
            flags=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
